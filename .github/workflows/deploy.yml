name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплой не отменяем на полпути: недокатанная ревизия хуже, чем лишняя минута ожидания.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: robo-wash
  CLOUD_RUN_SERVICE: robo-wash

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Токен нужен только шагу checkout: авторизация в Google Cloud идёт по ключу сервисного аккаунта.
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VITE_2GIS_MAP_KEY: ${{ secrets.VITE_2GIS_MAP_KEY }}
        run: |
          registry="$GCP_REGION-docker.pkg.dev"
          image="$registry/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLOUD_RUN_SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$registry" --quiet
          docker build --build-arg VITE_2GIS_MAP_KEY="$VITE_2GIS_MAP_KEY" --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
