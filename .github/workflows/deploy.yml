name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплой не отменяем на полпути: недокатанная ревизия хуже, чем лишняя минута ожидания.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_REGION: europe-west4
  ARTIFACT_REPOSITORY: robo-wash
  API_SERVICE: robo-wash-api
  CLIENT_SERVICE: robo-wash

jobs:
  # API катится первым и отдаёт наружу свой адрес: клиент запекает его в бандл на этапе сборки, поэтому
  # угадывать URL заранее или дублировать его в секретах не приходится — он приезжает выходом этого job'а.
  api:
    runs-on: ubuntu-latest
    # Токен нужен только шагу checkout: авторизация в Google Cloud идёт по ключу сервисного аккаунта.
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          registry="$GCP_REGION-docker.pkg.dev"
          image="$registry/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$API_SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$registry" --quiet
          docker build --tag "$image" src/RoboWash.Api
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # Строку подключения к базе сюда не передаём: она привязана к сервису секретом Secret Manager,
      # а стратегия обновления у экшена по умолчанию merge, поэтому деплой её не трогает.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated

  client:
    needs: api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VITE_2GIS_MAP_KEY: ${{ secrets.VITE_2GIS_MAP_KEY }}
          API_URL: ${{ needs.api.outputs.url }}
        run: |
          # Пустой адрес молча собрал бы клиент с относительным путём: запросы ушли бы в nginx, тот вернул бы
          # index.html, и демо сломалось бы уже в браузере. Ловим здесь, пока это ещё одна строка в логе.
          if [ -z "$API_URL" ]; then
            echo "Адрес сервиса $API_SERVICE не приехал из job'а api" >&2
            exit 1
          fi

          registry="$GCP_REGION-docker.pkg.dev"
          image="$registry/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$CLIENT_SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$registry" --quiet
          docker build \
            --build-arg VITE_2GIS_MAP_KEY="$VITE_2GIS_MAP_KEY" \
            --build-arg VITE_API_BASE_URL="$API_URL" \
            --tag "$image" src/robo-wash-react
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLIENT_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
